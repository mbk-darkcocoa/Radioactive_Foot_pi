name: GitLab main branch sync

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main branch to GitLab
        env:
          GITLAB_MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
        run: |
          if [ -z "${GITLAB_MIRROR_URL}" ]; then
            echo "::notice::GITLAB_MIRROR_URL is not configured; skipping mirror sync."
            exit 0
          fi
          target_branch="main"
          git remote add gitlab "${GITLAB_MIRROR_URL}"
          git fetch gitlab "refs/heads/${target_branch}:refs/remotes/gitlab/${target_branch}" || true
          remote_ref="refs/remotes/gitlab/${target_branch}"
          if git show-ref --verify --quiet "${remote_ref}"; then
            remote_sha="$(git rev-parse "${remote_ref}")"
            git push --force-with-lease="refs/heads/${target_branch}:${remote_sha}" --prune gitlab "HEAD:refs/heads/${target_branch}"
          else
            git push --prune gitlab "HEAD:refs/heads/${target_branch}"
          fi
