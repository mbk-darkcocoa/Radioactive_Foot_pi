name: Repository validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: common
            type: python
            path: common
          - name: dark-cocoa-dc
            type: python
            path: dark-cocoa-dc
          - name: schemas
            type: proto
            path: schemas
    name: Validate ${{ matrix.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up shared tooling
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Compile Python sources
        if: ${{ matrix.type == 'python' }}
        run: python -m compileall ${{ matrix.path }}

      - name: Check protobuf schema metadata
        if: ${{ matrix.type == 'proto' }}
        run: |
          python - <<'PY'
          from pathlib import Path

          proto_dir = Path("schemas")
          proto_files = sorted(proto_dir.glob("*.proto"))
          if not proto_files:
              raise SystemExit("No protobuf schema files found.")

          required_tokens = ('syntax = "proto3";', "package ", "message ")
          for proto_file in proto_files:
              content = proto_file.read_text(encoding="utf-8")
              missing = [token for token in required_tokens if token not in content]
              if missing:
                  raise SystemExit(f"{proto_file} is missing required declarations: {', '.join(missing)}")
              print(f"validated {proto_file}")
          PY
